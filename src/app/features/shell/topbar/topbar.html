<div class="topbar">
  <div class="flex items-center gap-2">
    <div>
      <button
        type="button"
        class="btn-icon"
        title="Toggle sidebar"
        aria-label="Toggle sidebar"
        (click)="layout.toggleSidebar()"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <!-- Pickup address selector (donors) -->
    @if (isDonor()) {
      <app-popover-menu
        [open]="addrOpen()"
        (openChange)="addrOpen.set($event)"
        align="start"
        panelClass="w-[300px]"
        ariaLabel="Pickup address"
      >
        <button
          fbTrigger
          type="button"
          class="addr-btn"
          (click)="toggleAddr()"
          title="Pickup address"
        >
          <i class="fa-solid fa-location-dot text-primary"></i>
          <span class="addr-label truncate max-w-[120px] sm:max-w-[180px]">{{
            pickup.selected()?.label || 'Set pickup address'
          }}</span>
          <i class="fa-solid fa-chevron-down text-[10px] text-muted addr-caret"></i>
        </button>
        <ng-template fbPanel>
          <div class="p-2">
            <div class="px-2 py-1 small-label">Pickup address</div>
            @for (a of pickup.addresses(); track a.id) {
              <div
                class="addr-item"
                [class.sel]="a.id === pickup.selected()?.id"
                (click)="selectAddr(a.id)"
              >
                <i
                  class="fa-solid mr-2"
                  [class]="
                    a.id === pickup.selected()?.id
                      ? 'fa-circle-check text-primary'
                      : 'fa-location-dot text-muted'
                  "
                ></i>
                <span class="flex-1 text-sm truncate">{{ a.label }}</span>
              </div>
            } @empty {
              <div class="text-muted text-sm px-2 py-1">No saved addresses yet</div>
            }
            <hr class="my-1.5 border-line" />
            <!-- A real href, so the new tab is the browser's own navigation and
                 middle-click / ctrl-click behave the same as a plain click. -->
            <a
              class="addr-add"
              [routerLink]="profileLink"
              target="_blank"
              rel="noopener"
              (click)="closeMenus()"
            >
              <i class="fa-solid fa-plus" aria-hidden="true"></i>Add new address
              <i class="fa-solid fa-up-right-from-square ext" aria-hidden="true"></i>
              <span class="sr-only">(opens in a new tab)</span>
            </a>
          </div>
        </ng-template>
      </app-popover-menu>
    }
  </div>

  <div class="flex items-center gap-2 sm:gap-4">
    @if (availability.appliesToCurrentUser()) {
      <app-availability-toggle />
    }

    <!-- Light / dark theme (hidden on phones — also available in the profile menu) -->
    <button
      type="button"
      class="btn-icon theme-btn"
      (click)="theme.toggle()"
      [title]="theme.darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-label]="theme.darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="theme.darkMode()"
    >
      <i class="fa-solid" [class]="theme.darkMode() ? 'fa-sun' : 'fa-moon'"></i>
    </button>

    <!-- Notifications -->
    <app-notification-bell [open]="notifOpen()" (openChange)="onNotifOpenChange($event)" />

    <!-- Profile -->
    <app-popover-menu
      [open]="menuOpen()"
      (openChange)="menuOpen.set($event)"
      align="end"
      panelClass="w-[220px]"
      ariaLabel="Account menu"
    >
      <button fbTrigger type="button" class="avatar-btn" (click)="toggleMenu()">
        <app-avatar [name]="userName()" [imageUrl]="avatarUrl()" [size]="40" />
      </button>
      <!-- Who's signed in, at the left of the modal's header bar (phones only). -->
      <ng-template fbPanelHeader>
        <div class="min-w-0">
          <div class="font-semibold text-sm truncate">{{ userName() }}</div>
          <app-role-badge class="mt-1" [role]="role()" size="sm" />
        </div>
      </ng-template>
      <ng-template fbPanel>
        <div class="p-2">
          <!-- Hidden below sm: the modal's header bar already shows this, and the
               popover-menu switches to that modal at exactly the same width. -->
          <div class="hidden sm:block px-3 pt-2 pb-2.5 border-b border-line mb-1">
            <div class="font-semibold text-sm truncate">{{ userName() }}</div>
            <app-role-badge class="mt-1.5" [role]="role()" size="sm" />
          </div>
          <a class="dropdown-item" (click)="go('profile')"
            ><i class="fa-solid fa-user"></i>Profile</a
          >
          <a class="dropdown-item" (click)="go('settings')"
            ><i class="fa-solid fa-gear"></i>Settings</a
          >
          <button
            type="button"
            class="dropdown-item w-full justify-between"
            role="switch"
            [attr.aria-checked]="theme.darkMode()"
            (click)="theme.toggle()"
          >
            <span class="flex items-center gap-2">
              <i class="fa-solid" [class]="theme.darkMode() ? 'fa-sun' : 'fa-moon'"></i>Dark mode
            </span>
            <span class="fb-switch" [class.on]="theme.darkMode()"><span class="knob"></span></span>
          </button>
          <hr class="my-1 border-line" />
          <a class="dropdown-item !text-red-600" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>Logout
          </a>
        </div>
      </ng-template>
    </app-popover-menu>
  </div>
</div>
