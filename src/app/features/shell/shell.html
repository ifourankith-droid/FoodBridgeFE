<div class="fb-shell">
  <app-sidebar />
  <div class="fb-main" [class.collapsed]="layout.collapsed()">
    <app-topbar />
    <app-verification-banner />
    <div class="fb-page-body">
      <router-outlet />
    </div>
  </div>
</div>

@if (layout.sidebarOpen()) {
  <div class="fb-backdrop" [fbScrollLock]="true" (click)="layout.closeSidebar()"></div>
}
