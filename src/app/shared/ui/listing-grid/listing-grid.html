@if (loading()) {
  <div [class]="gridClasses()">
    @for (s of skeletons(); track $index) {
      <div class="sk-card">
        <div class="sk h-11 w-11 !rounded-2xl mb-3"></div>
        <div class="sk h-4 w-2/3 mb-2"></div>
        <div class="sk h-3 w-1/2 mb-4"></div>
        <div class="sk h-6 w-full"></div>
      </div>
    }
  </div>
} @else if (empty()) {
  <!-- On a card surface, matching the notification inbox and the track/verifications
       pages. Bare on the page background it read as a gap where the list failed to
       render rather than a deliberate empty. -->
  <div class="card-fb">
    <app-empty-state
      [icon]="emptyIcon()"
      [title]="emptyTitle()"
      [text]="emptyText()"
      [actionLabel]="emptyActionLabel()"
      [actionIcon]="emptyActionIcon()"
      [actionVariant]="emptyActionVariant()"
      (action)="emptyAction.emit()"
    />
  </div>
} @else {
  <div [class]="gridClasses()">
    <ng-content />
  </div>
}
